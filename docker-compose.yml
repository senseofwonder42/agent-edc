# PostgreSQL for Aegra (threads + checkpoints). `aegra dev` starts it automatically.
# The API itself runs on the host: it needs the Oracle client (thick mode).
services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: agent_edc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent_edc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-agent_edc}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent_edc}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
