[project]
name = "agent-edc"
version = "0.1.0"
description = "Agent conversationnel sur un dossier E-décès (lecture seule)"
readme = "README.md"
authors = [
    { name = "afleuren", email = "antoine.j.fleurentin@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.1",
    "langchain-openai>=1.6.2",
    "langfuse>=4.15.4",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "loguru>=0.7.3",
    "oracledb>=26.0.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.2",
    "typing-extensions>=4.16.0",
]

[project.scripts]
agent-edc = "agent_edc.cli:app"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.31",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live and not parity'"
markers = [
    "live: nécessite Oracle + wallet + vLLM (§ 12.4)",
    "parity: compare les nomenclatures avec files_late_fee (§ 2.4)",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
# Ported verbatim: kept byte-comparable with files_late_fee (§ 2.4).
extend-exclude = ["src/agent_edc/edc/nomenclatures.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
